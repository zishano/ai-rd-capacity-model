name: Python tests
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/moe_hardware_sweep.py --output artifacts/moe_hardware_sweep.csv
      - run: python scripts/agent_inference_evidence_audit.py --output artifacts/agent_inference_scenarios.csv
      - uses: actions/upload-artifact@v4
        with:
          name: moe-hardware-sweep
          path: artifacts/moe_hardware_sweep.csv

      - uses: actions/upload-artifact@v4
        with:
          name: agent-inference-evidence-audit
          path: artifacts/agent-inference-scenarios.csv
